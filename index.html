<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Our Memories ♡</title>

  <!--
    STEP: ใส่ URL ที่ลงท้ายด้วย /exec ของ Apps Script ตรง 2 จุดด้านล่าง
  -->
  <meta http-equiv="refresh" content="0;url=YOUR_APPS_SCRIPT_EXEC_URL">

  <style>
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#626477;
      background:linear-gradient(135deg,#dff3ff,#ffe7f0);
    }
    .card{background:#fff;padding:28px;border-radius:24px;box-shadow:0 15px 45px #68708322;text-align:center}
  </style>
</head>
<body>
  <div class="card">Opening Our Memories ♡</div>
  <script>
    const APP_URL = 'YOUR_APPS_SCRIPT_EXEC_URL';
    if (!APP_URL.includes('YOUR_APPS_SCRIPT_EXEC_URL')) {
      window.location.replace(APP_URL);
    }
  </script>
</body>
</html>
